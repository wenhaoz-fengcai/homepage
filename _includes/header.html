{% assign is_zh = false %}{% if page.lang == 'zh' %}{% assign is_zh = true %}{% endif %}
<a class="skip-link" href="#main-content">{% if is_zh %}跳至正文{% else %}Skip to content{% endif %}</a>
<header class="site-header">
  <div class="header-inner">
    <nav class="site-nav" aria-label="{% if is_zh %}主导航{% else %}Primary navigation{% endif %}">
      {% if is_zh %}
        <a href="{{ '/zh/' | relative_url }}">首页</a>
        <a href="{{ '/zh/publications/' | relative_url }}">论文</a>
        <a href="{{ '/zh/research/' | relative_url }}">研究方向</a>
        <a href="{{ '/zh/people/' | relative_url }}">成员</a>
        <a href="{{ '/zh/teachings/' | relative_url }}">教学</a>
      {% else %}
        <a href="{{ '/' | relative_url }}">Home</a>
        <a href="{{ '/publications/' | relative_url }}">Publications</a>
        <a href="{{ '/research/' | relative_url }}">Research</a>
        <a href="{{ '/people/' | relative_url }}">People</a>
        <a href="{{ '/teachings/' | relative_url }}">Teachings</a>
      {% endif %}
    </nav>
    {% include language-switch.html %}
  </div>
</header>
