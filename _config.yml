title: "Wenhao Zhang"
subtitle: "AI for Health"
description: "Wenhao Zhang's research in causal intelligence, disease dynamics, and clinical AI."
url: "https://wenhaoz-fengcai.github.io"
baseurl: "/homepage"
permalink: pretty
markdown: kramdown
timezone: Asia/Shanghai

collections:
  students:
    output: false
  projects:
    output: false
  publications:
    output: false
  teaching:
    output: false
  news:
    output: false

defaults:
  - scope:
      path: ""
    values:
      layout: page
      lang: en

exclude:
  - artifacts
  - deploy
  - README.md
  - Gemfile
  - Gemfile.lock
  - scripts
  - vendor
